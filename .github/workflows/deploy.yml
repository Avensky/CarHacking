name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - name: Checkout to the repository
        uses: actions/checkout@v4
      - name: Set up NodeJS environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.3
      - name: Reinstall backend dependencies and rebuild
        run: |
          rm -rf node_modules package-lock.json
          npm i
          npm rebuild socketcan || true
      - name: Check linting and formatting
        run: npm run lint
      - name: Execute test cases
        run: echo testing...
  frontend:
    needs: backend
    runs-on: self-hosted
    steps:
      - name: Checkout to the repository
        uses: actions/checkout@v4
      - name: Set up NodeJS environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.3
      - name: Cache node modules
        id: cache-frontend
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: frontend/node_modules
          key: ${{runner.os}}-frontend-${{env.cache-name}}-${{ hashFiles('frontend/package-lock.json')}}
          restore-keys: |
            ${{ runner.os }}-frontend-${{ env.cache-name }}
            ${{ runner.os }}-frontend-
            ${{ runner.os }}-
      - name: Install Dependencies
        if: steps.cache-frontend.outputs.cache-hit !='true'
        run: |
          cd frontend
          npm i
      - name: Check linting and formatting
        run: |
          cd frontend
          npm run lint
  build:
    needs: frontend
    runs-on: self-hosted
    steps:
      - name: Checkout to the repository
        uses: actions/checkout@v4
      - name: Set up NodeJS environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.3
      - name: Use cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: |
            backend-cache-backend-${{ hashFiles('package-lock.json')}}
            frontend-cache-frontend-${{ hashFiles('frontend/package-lock.json')}}
      - name: Install Dependencies
        run: |
          npm i
          cd frontend
          npm i
      - name: Create production build
        run: |
          cd frontend
          npm run build
  restartServer:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Ensure vcan0 is active
        run: |
          sudo modprobe can
          sudo modprobe vcan
          sudo modprobe can_raw
          if ! ip link show vcan0 > /dev/null 2>&1; then
            sudo ip link add dev vcan0 type vcan
          fi
          sudo ip link set up vcan0  
      - name: Restart PM2 with updated env
        run: |
          pm2 stop CarHacking || true
          pm2 start CarHacking --update-env
          pm2 save
          sudo service nginx restart
      - name: Check vcan0 status
        run: ip a | grep vcan0
